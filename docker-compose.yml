version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: govinnovate-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: govinnovate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

  ai-service:
    build: ./ai
    container_name: govinnovate-ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  backend:
    build: ./backend
    container_name: govinnovate-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=govinnovate_super_secret_jwt_key_2026
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/govinnovate
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - postgres
      - ai-service

volumes:
  pgdata:
